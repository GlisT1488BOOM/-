<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>С годовщиной, любовь моя ❤️</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #ff6b9d 0%, #ff4d6d 40%, #c9184a 100%);
      font-family: 'Georgia', serif;
      overflow-x: hidden;
      position: relative;
      padding: 40px 20px;
    }

    /* Летающие сердечки */
    .heart-bg {
      position: fixed;
      color: rgba(255, 255, 255, 0.7);
      pointer-events: none;
      animation: floatUp linear infinite;
      user-select: none;
      z-index: 1;
    }
      .timer-box {
      min-width: 200px;
      padding: 20px 40px;
    }
    
    .timer-number {
      font-size: 4rem; /* Делаем цифру очень большой */
    }

    @keyframes floatUp {
      0%   { transform: translateY(100vh) scale(0.4) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.3) rotate(360deg); opacity: 0; }
    }

    .content {
      position: relative;
      z-index: 10;
      max-width: 1100px;
      margin: 0 auto;
      text-align: center;
    }

    .main-title {
      font-size: clamp(2rem, 7vw, 5rem);
      color: #fff;
      font-weight: bold;
      letter-spacing: 3px;
      text-shadow: 0 0 10px #fff, 0 0 25px #ffb3c6, 0 0 50px #ff0033, 0 0 90px #ff0033;
      animation: glow 1.8s ease-in-out infinite;
      margin-bottom: 20px;
      line-height: 1.2;
    }

    @keyframes glow {
      0%, 100% { text-shadow: 0 0 10px #fff, 0 0 25px #ffb3c6, 0 0 50px #ff0033, 0 0 90px #ff0033; }
      50%      { text-shadow: 0 0 20px #fff, 0 0 45px #ffb3c6, 0 0 90px #ff0033, 0 0 160px #ff0033; }
    }

    /* === СТИЛИ ДЛЯ ТАЙМЕРА === */
    .timer-container {
      margin: 20px 0 50px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      display: inline-block;
    }

    .timer-title {
      color: #fff;
      font-size: 1.2rem;
      font-family: sans-serif;
      margin-bottom: 15px;
      letter-spacing: 1px;
      opacity: 0.9;
    }

    .timer {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .timer-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255, 255, 255, 0.2);
      padding: 10px 15px;
      border-radius: 12px;
      min-width: 70px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .timer-number {
      font-size: 1.8rem;
      font-weight: bold;
      color: #fff;
      font-family: 'Georgia', serif;
      text-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .timer-label {
      font-size: 0.8rem;
      color: #ffe0ec;
      font-family: sans-serif;
      text-transform: uppercase;
      margin-top: 5px;
    }

    /* Остальные стили (сетка любви, галерея) остаются прежними */
    .love-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-top: 20px;
    }

    .love-word {
      display: inline-block;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50px;
      color: #fff;
      font-size: clamp(0.95rem, 2.5vw, 1.3rem);
      font-family: sans-serif;
      font-weight: 600;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      animation: pop 3s ease-in-out infinite;
      transition: transform 0.3s, background 0.3s;
    }

    .love-word:hover {
      transform: scale(1.15) rotate(-3deg);
      background: rgba(255, 255, 255, 0.35);
    }

    @keyframes pop {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.05); }
    }

    .love-word:nth-child(3n)  { animation-delay: 0.3s; }
    .love-word:nth-child(3n+1){ animation-delay: 0.6s; }
    .love-word:nth-child(4n)  { animation-delay: 0.9s; }

    .gallery-title {
      color: #fff;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      margin: 70px 0 30px;
      font-family: 'Georgia', serif;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
      letter-spacing: 1px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      padding: 10px;
    }

    .photo-card {
      background: #fff;
      padding: 12px 12px 25px 12px;
      border-radius: 5px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      transition: transform 0.4s ease, z-index 0.4s ease;
      position: relative;
      opacity: 0;
      transform: translateY(30px);
    }

    .photo-card:nth-child(odd)  { transform: translateY(30px) rotate(-2deg); }
    .photo-card:nth-child(even) { transform: translateY(30px) rotate(2deg); }
    .photo-card:nth-child(3n)   { transform: translateY(30px) rotate(-1deg); }
    .photo-card:nth-child(4n)   { transform: translateY(30px) rotate(3deg); }

    .photo-card.show {
      opacity: 1;
      transform: translateY(0) rotate(0deg);
    }

    .photo-card:hover {
      transform: scale(1.08) rotate(0deg) !important;
      z-index: 20;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    }

    .photo-card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-radius: 3px;
      display: block;
    }

    .photo-caption {
      font-family: 'Georgia', serif;
      color: #555;
      font-size: 1.1rem;
      margin-top: 15px;
      font-style: italic;
    }

    .back {
      display: inline-block;
      margin-top: 60px;
      color: #fff;
      text-decoration: none;
      font-family: sans-serif;
      font-size: 1rem;
      padding: 10px 22px;
      border: 2px solid #fff;
      border-radius: 40px;
      transition: all 0.3s;
      opacity: 0.85;
    }

    .back:hover {
      background: #fff;
      color: #c9184a;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="content">
    <h1 class="main-title">С ГОДОВАНИЕЙ,<br>ЛЮБОВЬ МОЯ ❤️</h1>

    <!-- === БЛОК ТАЙМЕРА === -->
    <div class="timer-container">
      <div class="timer-title">Мы вместе уже:</div>
      <div class="timer" id="timer">
        <div class="timer-box"><span class="timer-number" id="days">0</span><span class="timer-label">дней</span></div>
      </div>
    </div>

    <div class="love-grid" id="loveGrid"></div>

    <h2 class="gallery-title">Проста ну мы</h2>
    <div class="gallery" id="gallery">
      <div class="photo-card">
        <img src="photo1.webp" alt="Ета мы">
        <div class="photo-caption">Ета мы ❤️</div>
      </div>
      <div class="photo-card">
        <img src="photo2.webp" alt="Ета мы">
        <div class="photo-caption">Ета мы на выпускном ❤️</div>
      </div>
      <div class="photo-card">
        <img src="photo3.webp" alt="Ета мы">
        <div class="photo-caption">Ета ты крутая патриоточка❤️</div>
      </div>
      <div class="photo-card">
        <img src="photo4.webp" alt="Ета мы">
        <div class="photo-caption">Ета я обложался, зато фоточка крутая ❤️</div>
      </div>
      <div class="photo-card">
        <img src="photo5.webp" alt="Ета мы">
        <div class="photo-caption">Ну ета прям мыы ❤️</div>
      </div>
      <div class="photo-card">
        <img src="photo6.webp" alt="Ета мы">
        <div class="photo-caption">Ета некая загадочность ❤️</div>
      </div>
      <div class="photo-card">
        <img src="photo7.webp" alt="Ета мы">
        <div class="photo-caption">Ета я ❤️</div>
      </div>
      <div class="photo-card">
        <img src="photo9.webp" alt="Ета мы">
        <div class="photo-caption">А тут я песик ❤️</div>
      </div>
      <div class="photo-card">
        <img src="photo10.webp" alt="Ета мы">
        <div class="photo-caption">А ета любовь всей моей жизни ❤️</div>
      </div>
      <!-- ... остальные фото-карточки ... -->
    </div>

    <a href="index.html" class="back">← назад к сердцу</a>
  </div>

  <script>
    // ===== ТАЙМЕР =====
    // ВАЖНО: Укажи здесь дату вашего первого дня вместе!
    // Формат: 'Год-Месяц-ДеньTЧасы:Минуты:Секунды'
    // Например: '2023-06-15T00:00:00' (15 июня 2023 года)
    const startDate = new Date('2026-05-25T00:00:00').getTime();

    function updateTimer() {
      const now = new Date().getTime();
      const distance = now - startDate;

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      

      document.getElementById('days').innerText = days;
      
    }

    // Обновляем каждую секунду
    setInterval(updateTimer, 1000000000);
    updateTimer(); // Запускаем сразу при загрузке


    // ===== ОСТАЛЬНОЙ КОД (сердечки, надписи, галерея) =====
    const grid = document.getElementById('loveGrid');
    const phrases = ['Я люблю тебя', 'Я очень люблю тебя', 'Я люблю тебя ❤️', 'Люблю тебя бесконечно'];
    const count = 60;

    for (let i = 0; i < count; i++) {
      const span = document.createElement('span');
      span.className = 'love-word';
      span.textContent = phrases[i % phrases.length];
      span.style.transform = `rotate(${(Math.random() * 6 - 3).toFixed(1)}deg)`;
      grid.appendChild(span);
    }

    const hearts = ['❤️', '💖', '💕', '💗', '💓', '💞', '🤍', '💝', '💘'];
    function createHeart() {
      const h = document.createElement('div');
      h.className = 'heart-bg';
      h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.fontSize = (16 + Math.random() * 40) + 'px';
      h.style.animationDuration = (5 + Math.random() * 8) + 's';
      h.style.animationDelay = Math.random() * 4 + 's';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 14000);
    }
    setInterval(createHeart, 250);
    for (let i = 0; i < 30; i++) createHeart();

    const cards = document.querySelectorAll('.photo-card');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('show');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });

    cards.forEach(card => observer.observe(card));
  </script>
</body>
</html>
