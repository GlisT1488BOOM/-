<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моя любимая ❤️</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffe0ec 0%, #ffb6c1 50%, #ff8fab 100%);
      font-family: 'Georgia', serif;
      overflow: hidden;
      position: relative;
    }

    /* Летающие сердечки на фоне */
    .heart-bg {
      position: absolute;
      color: rgba(255, 255, 255, 0.6);
      font-size: 24px;
      animation: floatUp linear infinite;
      pointer-events: none;
      user-select: none;
    }

    @keyframes floatUp {
      0%   { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
    }

    .title {
      font-size: clamp(3rem, 10vw, 7rem);
      color: #fff;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      text-shadow:
        0 0 10px #fff,
        0 0 20px #ff4d6d,
        0 0 40px #ff4d6d,
        0 0 80px #ff4d6d;
      animation: pulse 2s ease-in-out infinite;
      transition: transform 0.3s ease;
      z-index: 10;
      padding: 20px;
    }

    .title:hover {
      transform: scale(1.1);
      text-shadow:
        0 0 15px #fff,
        0 0 30px #ff0033,
        0 0 60px #ff0033,
        0 0 120px #ff0033;
    }

    @keyframes pulse {
      0%, 100% {
        text-shadow:
          0 0 10px #fff,
          0 0 20px #ff4d6d,
          0 0 40px #ff4d6d,
          0 0 80px #ff4d6d;
      }
      50% {
        text-shadow:
          0 0 20px #fff,
          0 0 40px #ff4d6d,
          0 0 80px #ff4d6d,
          0 0 160px #ff4d6d;
      }
    }

    .hint {
      position: absolute;
      bottom: 30px;
      color: #fff;
      font-size: 1rem;
      opacity: 0.8;
      animation: blink 2s infinite;
      font-family: sans-serif;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <a href="love.html" class="title">Моя любимая</a>
  <div class="hint">нажми на надпись 💗</div>

  <script>
    // Генерация летающих сердечек
    const hearts = ['❤️', '💖', '💕', '💗', '💓', '💞', '🤍', '💝'];
    function createHeart() {
      const h = document.createElement('div');
      h.className = 'heart-bg';
      h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.fontSize = (16 + Math.random() * 36) + 'px';
      h.style.animationDuration = (6 + Math.random() * 8) + 's';
      h.style.animationDelay = Math.random() * 5 + 's';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 15000);
    }
    setInterval(createHeart, 300);
    for (let i = 0; i < 20; i++) createHeart();
  </script>
</body>
</html>
